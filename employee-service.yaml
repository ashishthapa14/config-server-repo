spring:
  docker:
    compose:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/employee_db}
    username: ${SPRING_DATASOURCE_USERNAME:employee_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ashish123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public

logging:
  config: classpath:log-spring.xml
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.docker.compose: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8085
  servlet:
    context-path: /api

department:
  service:
    url: ${DEPARTMENT_SERVICE_URL:http://localhost:8082}


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
