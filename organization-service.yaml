spring:
  docker:
    compose:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/organization_db}
    username: ${SPRING_DATASOURCE_USERNAME:organization_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ashish123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public

logging:
  config: classpath:log-spring.xml
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.docker.compose: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"

server:
  port: 8085
  servlet:
    context-path: /api

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
